<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubユーザー情報表示ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex justify-center items-center">
    <div  class="bg-stone-50 border border-stone-200 p-6 max-w-2xl w-full mx-auto text-stone-700">
        <h1 class="text-base font-medium text-stone-800 uppercase mb-4">GitHubユーザー検索</h1>
        <p class="mb-1 text-sm text-slate-400">入力したユーザー名の情報を取得して表示</p>

        <input 
        id="nameInput" 
        type="text"
        placeholder="ユーザーネームを入力..." 
        class="bg-white border border-stone-300 p-2 mb-3 text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:border-stone-500 transition">
        <button id="btn" class="bg-gray-700 text-white text-2xl w-full py-2 rounded-lg font-semibold hover:bg-gray-800 mb-6">検索</button>

        <p id="status" class="text-gray-700 text-2xl text-center font-bold"></p>
        <div id="userList"></div>
    </div>

<script>
    const userList = document.querySelector("#userList");
    const btn = document.querySelector("#btn");
    const nameInput = document.querySelector("#nameInput");
    const status = document.querySelector("#status");

    const render = (user)=>{
            const listCard = document.createElement("div");
            listCard.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow duration-200 border border-slate-200/80 p-6 text-center";
            listCard.innerHTML = `
            <img src="${user.avatar_url}" alt="アバター画像" class="mx-auto">
            <p class="text-2xl font-bold text-slate-900 mt-1">${user.name|| "名前未設定"}</p>
            <p class="text-slate-600 text-sm mt-1 leading-relaxed">${user.bio|| "自己紹介はありません"}</p>
            <p class="text-md font-bold text mt-1 slate-900">フォロワー数：${user.followers}</p>
            `;
            userList.appendChild(listCard);
        };

        const loadUsers = async (b) => {
            try {const response = await fetch(`https://api.github.com/users/${b}`);

            if(!response.ok){
            throw new Error("エラー ："+response.status);
            };

            const users = await response.json();
            render(users);

        }catch(err){
        console.error(err);
        status.textContent= "ユーザーが見つかりませんでした";
        };
        };  
    
    btn.addEventListener("click",() =>{
        userList.innerHTML = "";
        const name = nameInput.value;
        loadUsers(name);
        }); 
</script>
    
</body>
</html>
